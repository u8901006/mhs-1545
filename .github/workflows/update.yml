name: Update Taipei MHS Clinics

on:
  schedule:
    # GitHub cron is UTC. This is Monday 01:00 in Asia/Taipei.
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Set up Node.js 24
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify secret
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          if [ -z "$ZHIPU_API_KEY" ]; then
            echo "::error::ZHIPU_API_KEY secret is not set"
            exit 1
          fi

      - name: Generate GitHub Pages HTML
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: npm run update

      - name: Commit and push generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/last-mhs.json
          if git diff --cached --quiet; then
            echo "No generated page changes"
            exit 0
          fi
          git commit -m "chore: update Taipei MHS clinic page"
          git pull --rebase origin main
          git push
